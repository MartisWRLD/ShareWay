name: shareway
description: "ShareWay – Fahrgemeinschafts-App (iOS, Android, Web)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management & Navigation ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # --- Firebase (Backend) ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_database: ^11.1.6 # Realtime DB – für Live-Tracking (niedrige Latenz)
  firebase_storage: ^12.3.7  # Profilbilder
  cloud_functions: ^5.1.6    # z.B. serverseitige Tarifberechnung

  # --- Karte & TomTom API ---
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^13.0.2

  # --- UI / Utilities ---
  cupertino_icons: ^1.0.8
  intl: 0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  flutter_rating_bar: ^4.0.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
